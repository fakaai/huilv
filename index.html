<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时汇率转换器 - 极简金融工具</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f3f4f6;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .converter-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: var(--text-main);
            font-size: 24px;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.9);
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .currency-row {
            display: grid;
            grid-template-columns: 1fr 40px 1fr;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .swap-btn {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            margin-top: 24px;
        }

        .swap-btn:hover {
            transform: rotate(180deg);
            background-color: var(--primary-color);
            color: #fff;
        }

        .result-box {
            background: rgba(79, 70, 229, 0.05);
            border: 1px dashed var(--primary-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 25px;
        }

        .result-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .result-rate {
            font-size: 13px;
            color: var(--text-muted);
        }

        .loading {
            opacity: 0.5;
            pointer-events: none;
        }

        /* 响应式底部提示 */
        .footer-tips {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <div>
        <div class="converter-card" id="card">
            <h1>📊 实时汇率转换器</h1>
            <div class="subtitle">数据每小时自动更新，支持全球主流货币</div>

            <!-- 金额输入 -->
            <div class="input-group">
                <label for="amount">转换金额</label>
                <input type="number" id="amount" value="100" min="0" placeholder="请输入金额...">
            </div>

            <!-- 货币选择区域 -->
            <div class="currency-row">
                <div class="input-group">
                    <label for="from-currency">从 (From)</label>
                    <select id="from-currency">
                        <option value="CNY" selected>CNY - 人民币</option>
                        <option value="USD">USD - 美元</option>
                        <option value="EUR">EUR - 欧元</option>
                        <option value="JPY">JPY - 日元</option>
                        <option value="HKD">HKD - 港币</option>
                        <option value="GBP">GBP - 英镑</option>
                        <option value="AUD">AUD - 澳元</option>
                        <option value="CAD">CAD - 加拿大元</option>
                        <option value="SGD">SGD - 新加坡元</option>
                    </select>
                </div>

                <button class="swap-btn" id="swap-btn" title="调换货币">⇄</button>

                <div class="input-group">
                    <label for="to-currency">到 (To)</label>
                    <select id="to-currency">
                        <option value="USD" selected>USD - 美元</option>
                        <option value="CNY">CNY - 人民币</option>
                        <option value="EUR">EUR - 欧元</option>
                        <option value="JPY">JPY - 日元</option>
                        <option value="HKD">HKD - 港币</option>
                        <option value="GBP">GBP - 英镑</option>
                        <option value="AUD">AUD - 澳元</option>
                        <option value="CAD">CAD - 加拿大元</option>
                        <option value="SGD">SGD - 新加坡元</option>
                    </select>
                </div>
            </div>

            <!-- 结果显示区 -->
            <div class="result-box">
                <div class="result-value" id="result-text">0.00</div>
                <div class="result-rate" id="rate-text">正在获取最新汇率...</div>
            </div>
        </div>
        <div class="footer-tips">数据源自开放汇率API • 结果仅供参考</div>
    </div>

    <script>
        // 使用免费且无需秘钥的 er-api
        const API_URL = "https://er-api.com";

        const amountInput = document.getElementById('amount');
        const fromCurrency = document.getElementById('from-currency');
        const toCurrency = document.getElementById('to-currency');
        const swapBtn = document.getElementById('swap-btn');
        const resultText = document.getElementById('result-text');
        const rateText = document.getElementById('rate-text');
        const card = document.getElementById('card');

        let cachedRates = {};

        // 获取汇率数据
        async function fetchRates(baseCurrency) {
            card.classList.add('loading');
            try {
                const response = await fetch(`${API_URL}${baseCurrency}`);
                if (!response.ok) throw new Error('网络请求失败');
                const data = await response.json();
                cachedRates[baseCurrency] = data.rates;
                calculateResult();
            } catch (error) {
                rateText.innerText = "汇率数据加载失败，请检查网络。";
                console.error(error);
            } finally {
                card.classList.remove('loading');
            }
        }

        // 计算转换结果
        function calculateResult() {
            const amount = parseFloat(amountInput.value);
            const from = fromCurrency.value;
            const to = toCurrency.value;

            if (isNaN(amount) || amount <= 0) {
                resultText.innerText = "0.00";
                rateText.innerText = "请输入有效的金额";
                return;
            }

            if (cachedRates[from] && cachedRates[from][to]) {
                const rate = cachedRates[from][to];
                const convertedAmount = (amount * rate).toFixed(2);
                
                // 格式化千分位输出
                resultText.innerText = `${parseFloat(convertedAmount).toLocaleString('zh-CN', {minimumFractionDigits: 2})}`;
                rateText.innerText = `1 ${from} = ${rate.toFixed(4)} ${to}`;
            } else {
                // 如果没有当前基准货币的缓存，则去请求
                fetchRates(from);
            }
        }

        // 监听事件
        amountInput.addEventListener('input', calculateResult);
        fromCurrency.addEventListener('change', () => fetchRates(fromCurrency.value));
        toCurrency.addEventListener('change', calculateResult);

        // 调换按钮逻辑
        swapBtn.addEventListener('click', () => {
            const temp = fromCurrency.value;
            fromCurrency.value = toCurrency.value;
            toCurrency.value = temp;
            fetchRates(fromCurrency.value);
        });

        // 页面首次加载
        window.addEventListener('load', () => {
            fetchRates(fromCurrency.value);
        });
    </script>
</body>
</html>
